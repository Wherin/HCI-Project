<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Consultation Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Header Banner -->
  <header class="top-banner">
    <div class="banner-brand">
      <h1>Student Consultation Portal</h1>
      <p>Submit questions and chat live with an academic advisor</p>
    </div>
    <div class="banner-status">
      <span class="status-indicator" id="auth-status"><span class="dot"></span> Connecting...</span>
    </div>
  </header>

  <!-- Submit Consultation Card -->
  <div class="form-card">
    <h2>Submit a Consultation</h2>
    <form id="consultationForm">
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
        <label for="studentName" style="font-weight: 600; font-size: 0.875rem;">Your Name</label>
        <label style="font-size: 0.8rem; cursor: pointer; color: #64748b;">
          <input type="checkbox" id="studentAnonCheck" onchange="toggleStudentAnon(this)"> Submit Anonymously
        </label>
      </div>
      <input type="text" id="studentName" placeholder="Enter your full name" required />

      <label for="initialMessage" style="font-weight: 600; font-size: 0.875rem; margin-top: 12px; display: block;">What is your question?</label>
      <textarea id="initialMessage" rows="2" placeholder="Describe your question or issue in detail..." required></textarea>

      <button type="submit" id="submit-btn" class="btn-primary" style="margin-top: 12px; align-self: flex-start;" disabled>
        Submit Consultation
      </button>
    </form>
  </div>

  <!-- Active Threads Header -->
  <div class="section-title">Your Consultations</div>
  
  <!-- Each consultation thread will render here as its own card box -->
  <div id="student-threads">Connecting to server...</div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, onSnapshot, query, where, doc, updateDoc, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBfiUPoxWkyHsDHp8ik5zOLnVLuLvTJMuo",
      authDomain: "test-project-6d44f.firebaseapp.com",
      projectId: "test-project-6d44f",
      storageBucket: "test-project-6d44f.firebasestorage.app",
      messagingSenderId: "396341054072",
      appId: "1:396341054072:web:7f67660251c6e319523b8d",
      measurementId: "G-1Z4QQ01SF3"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;

    // Toggle Anonymous Name
    window.toggleStudentAnon = function(checkbox) {
      const nameInput = document.getElementById('studentName');
      if (checkbox.checked) {
        nameInput.dataset.prev = nameInput.value;
        nameInput.value = "Anonymous Student";
        nameInput.disabled = true;
      } else {
        nameInput.value = nameInput.dataset.prev || "";
        nameInput.disabled = false;
      }
    };

    // 1. User Authentication: Sign in anonymously and handle auth state
    signInAnonymously(auth).catch((err) => console.error("Auth error:", err));
    
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const statusEl = document.getElementById('auth-status');
        if (statusEl) {
          statusEl.innerHTML = `<span class="dot"></span> Online (ID: ${user.uid.substring(0, 6)}...)`;
        }
        document.getElementById('submit-btn').disabled = false;
        loadUserThreads(user.uid);
      }
    });

    // 2. Load threads belonging strictly to this authenticated student
    function loadUserThreads(uid) {
      const q = query(collection(db, "consultations"), where("studentUid", "==", uid));
      
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('student-threads');
        if (snapshot.empty) {
          container.innerHTML = "<p style='padding: 12px; background: #ffffff; border-radius: 8px;'>You have no active consultations.</p>";
          return;
        }

        container.innerHTML = "";
        snapshot.forEach((docSnap) => {
          const data = docSnap.data();
          const docId = docSnap.id;
          const isResolved = data.status === "resolved";

          let messagesHTML = (data.messages || []).map(m => `
            <div class="msg ${m.senderRole}">
              <div class="msg-author">${m.senderName} (${m.timestamp})</div>
              <div>${m.text}</div>
            </div>
          `).join('');

          const card = document.createElement('div');
          card.className = `card ${isResolved ? 'resolved' : ''}`;
          card.innerHTML = `
            <div class="card-bar">
              <div class="card-info">
                <span class="student-name">${data.senderName || 'Anonymous Student'}</span>
                <span class="badge ${isResolved ? 'resolved' : 'active'}">${isResolved ? 'Resolved' : 'Active'}</span>
              </div>
            </div>

            <div class="thread" style="margin-top: 10px;">${messagesHTML}</div>

            ${isResolved ? `
              <div class="resolved-banner">
                🔒 This consultation has been marked as resolved by the consultant.
                Please submit a new consultation above if you have further questions.
              </div>
            ` : `
              <div class="reply-form">
                <textarea id="reply-input-${docId}" rows="1" placeholder="Type reply back to consultant..."></textarea>
                <button class="btn-primary" onclick="sendStudentReply('${docId}', '${data.senderName}')">Reply</button>
              </div>
            `}
          `;
          container.appendChild(card);
        });
      });
    }

    // 3. Submit New Consultation Form
    document.getElementById('consultationForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentUser) return alert("Session not ready yet.");

      const isAnon = document.getElementById('studentAnonCheck').checked;
      const studentName = isAnon ? "Anonymous Student" : document.getElementById('studentName').value.trim();
      const initialMessage = document.getElementById('initialMessage').value.trim();

      if (!initialMessage) return;

      try {
        await addDoc(collection(db, "consultations"), {
          studentUid: currentUser.uid,
          senderName: studentName,
          status: "active",
          createdAt: serverTimestamp(),
          messages: [{
            senderRole: "student",
            senderName: studentName,
            text: initialMessage,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          }]
        });

        document.getElementById('initialMessage').value = "";
        document.getElementById('initialMessage').style.height = "auto";
        if (!isAnon) document.getElementById('studentName').value = "";
      } catch (err) {
        alert("Failed to submit consultation: " + err.message);
      }
    });

    // 4. Student Reply Function
    window.sendStudentReply = async function(docId, studentName) {
      const inputEl = document.getElementById(`reply-input-${docId}`);
      const replyText = inputEl.value.trim();
      if (!replyText) return;

      try {
        await updateDoc(doc(db, "consultations", docId), {
          status: "active",
          messages: arrayUnion({
            senderRole: "student",
            senderName: studentName || "Student",
            text: replyText,
            timestamp: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
          })
        });
        inputEl.value = "";
        inputEl.style.height = "auto";
      } catch (err) {
        alert("Failed to send reply: " + err.message);
      }
    };


    // Auto-expanding textarea that respects a minimum 42px height
    document.addEventListener('input', (e) => {
      if (e.target.tagName.toLowerCase() === 'textarea') {
        const el = e.target;
        el.style.height = 'auto';
        
        // Math.max ensures the height NEVER drops below 42px
        const newHeight = Math.max(42, el.scrollHeight);
        el.style.height = `${newHeight}px`;
      }
    });
  </script>
</body>
</html>
